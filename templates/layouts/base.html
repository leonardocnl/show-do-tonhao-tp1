{% load static %}<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Show do Tonhão{% endblock %}</title>
  <script>
    /* Aplica modo, tema e fonte salvos (ou o modo do sistema) antes de pintar a página. */
    (function () {
      var raiz = document.documentElement;
      try {
        var modo = localStorage.getItem('tonhao-tema');
        if (!modo) { modo = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
        raiz.classList.toggle('dark', modo === 'dark');
        var paleta = localStorage.getItem('tonhao-paleta');
        if (paleta && paleta !== 'cozy') { raiz.setAttribute('data-palette', paleta); }
        var fonte = localStorage.getItem('tonhao-fonte');
        if (fonte && /^[A-Za-z0-9 ]+$/.test(fonte)) {
          raiz.style.setProperty('--fonte', '"' + fonte + '", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif');
        }
      } catch (erro) { /* mantém o padrão */ }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600..900&family=Fredoka:wght@500..700&family=Baloo+2:wght@500..800&family=Lexend:wght@500..900&family=Figtree:wght@500..900&family=Plus+Jakarta+Sans:wght@500..800&family=Atkinson+Hyperlegible:wght@400;700&family=DM+Sans:wght@500..900&display=swap" rel="stylesheet">
  <link href="{% static 'css/tailwind.css' %}?v=2" rel="stylesheet">
  {% block extra_head %}{% endblock %}
</head>
<body class="tema-cozy flex flex-col h-[100dvh] overflow-hidden">
  {% block navegacao %}{% include "layouts/navegacao.html" %}{% endblock %}

  <main class="mx-auto w-full max-w-[1400px] flex-1 min-h-0 overflow-auto overscroll-contain px-4 py-6 sm:px-6 relative flex flex-col">
    {% include "components/mensagens.html" %}
    {% block conteudo %}{% endblock %}
  </main>

  <script src="{% static 'js/aparencia.js' %}"></script>
  <script src="{% static 'js/navegacao.js' %}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
